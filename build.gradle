plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

repositories {
    mavenLocal()
    flatDir {
        dir 'libs'
    }
    maven {
        url "https://www.cursemaven.com"
    }
    maven {
        name = "JEI"
        url 'https://maven.blamejared.com'
    }
    maven {
        url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/"
    }
    maven {
        url = "https://maven.createmod.net"
    }
    maven {
        url = "https://mvn.devos.one/snapshots" // Registrate
    }
}

base {
    archivesName = mod_id
}

// Mojang ships Java 25 to end users starting in 26.1, so mods should target Java 25.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    // This line is optional. Access Transformers are automatically detected
    accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()

            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            clientData()

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // mostly optional in a single mod project
        // but multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

// Client render + datagen are ported. Only ponder stays excluded (Create has no 26.1.2 build).
// datagen: productivebees compat uses the local jar in libs/, allthemodium comes from cursemaven, and the
// patchouli / fusion / clayworks compat providers were dropped (no 26.1.2 builds). The vanilla model-gen API
// was migrated to net.minecraft.client.data.models.* and GatherDataEvent → GatherDataEvent.Client.
sourceSets.main.java {
    exclude 'cy/jdkdigital/productivemetalworks/integration/ponder/**'   // Create/ponder has no 26.1.2 build
}

tasks.named('jar', Jar) {
    exclude "data/${mod_id}/test_instance/**"
    exclude "data/${mod_id}/test_environment/**"
}

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    implementation "local.libs:productivelib-${lib_version}"
    jarJar(group: 'cy.jdkdigital.productivelib', name: 'productivelib', version: "${lib_version_range}") {
        transitive(false)
    }

    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    runtimeOnly "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"

    // Mod-compat dependencies — file IDs resolved against MC 26.1.2 on CurseForge.
    // Mods without a 26.1.2 release yet remain commented; re-check periodically and restore
    //   the matching integration/** sources as each becomes available.
    implementation "curse.maven:jade-324717:7938398"

    // datagen-only compat. productivebees: local 26.1 build in libs/ (compile for RecipeProvider, dev-runtime
    // for the data run + conditional recipes). allthemodium: cursemaven, dev-runtime only — its fluids are
    // referenced by id in conditional casting recipes so they must exist when datagen runs.
    compileOnly "local.libs:productivebees-26.1.2-14.4.0"
    localRuntime "local.libs:productivebees-26.1.2-14.4.0"
    localRuntime "curse.maven:allthemodium-364466:8157737"
    // allthemodium's required deps (datagen-runtime only) so its fluids exist when recipes generate.
    localRuntime "curse.maven:alltheores-405593:8023670"
    localRuntime "curse.maven:geckolib-388172:7913641"
//    implementation "curse.maven:fusion-connected-textures-854949:6108307"  // no 26.1.2 — Fusion compat dropped
//    implementation "curse.maven:productivebees-377897:7884151"  // no 26.1.2 published; using local libs/ jar above
//    implementation "com.simibubi.create:create-${minecraft_version}:${create_version}:slim"  // no 26.1.2 — ponder/flywheel integration excluded
//    implementation "net.createmod.ponder:ponder-neoforge:${ponder_version}"  // no 26.1.2
//    implementation "dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}"  // no 26.1.2
//    implementation "com.tterrag.registrate:Registrate:${registrate_version}"  // no 26.1.2
//    implementation "vazkii.patchouli:Patchouli:${patchouli_version}"  // no 26.1.2
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            issue_url              : issue_url,
            jei_version            : jei_version,
            lib_version            : lib_version,
            lib_version_range      : lib_version_range,
            patchouli_version      : patchouli_version
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
